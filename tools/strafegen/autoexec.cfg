// STRAFE 64 combat keybinds — auto-exec'd by the engine at startup (after
// q3config.cfg, so these win). Deployed into baseoa/ by scripts/run.ps1.
//
// The melee actions ride custom usercmd button bits (see bg_public.h /
// q_shared.h): BLOCK=bit12, DASH=bit13, KICK=bit14, bound via +button12/13/14.

bind F      "+button14"   // melee kick  (BUTTON_KICK — knockback scales with speed)
bind MOUSE2 "+button12"   // katana block / guard  (BUTTON_BLOCK)
bind CTRL   "+movedown"   // crouch / slide
bind SHIFT  "+button13"   // dash  (BUTTON_DASH — revectors toward enemies)

// --- Movement feel ---------------------------------------------------------
// STRAFE 64 is a movement game and its strafe-helper HUD computes optimal air
// angles at pmove_msec 8 (125 Hz). With pmove_fixed 0 the real air physics run
// at your render framerate instead, so airstrafe feels off and mismatched from
// the on-screen guide. Lock the simulation to a deterministic 125 Hz and raise
// the command rate so movement input isn't coarse (default cl_maxpackets 30 is
// far too low for airstrafe). All reversible — delete this block for stock feel.
seta pmove_fixed   "1"     // deterministic 125 Hz air physics (matches the strafe HUD)
seta pmove_msec    "8"     // 8 ms sim step = 125 Hz
seta com_maxfps    "125"   // render at the sim rate (vsync off: r_swapInterval 0)
seta cl_maxpackets "125"   // send 125 movement cmds/sec (was 30 -> chunky airstrafe)

echo "^2autoexec.cfg^7: STRAFE 64 binds + 125Hz movement loaded (kick=F block=MOUSE2 crouch/slide=CTRL dash=SHIFT)"

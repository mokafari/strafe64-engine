// Local pilot + five bots, 3v3. Conquest is not implemented by this preset.
set bot_minplayers 0
kick allbots
set com_slowmo 1
set g_timeBind 1
set g_timeBindMin 0.04
set g_timeBindMax 1
set g_gametype 3
set g_lattice 0
set g_vectorgun 0
set g_voidRise 0
set g_botSwordOnly 0
set g_friendlyFire 0
set g_teamAutoJoin 0
set g_teamForceBalance 0
set fraglimit 50
set timelimit 10
set sv_maxclients 8
map strafe64_nocturne_flow
wait 80
team red
addbot Major 3 red
addbot Sarge 3 red
addbot Grunt 3 blue
addbot Major 3 blue
addbot Sarge 3 blue

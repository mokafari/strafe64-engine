// nocturne look preset (docs/COLOUR_SCIENCE.md + ENGINE_REALISM_AUDIT.md), 1440p, GPU timers on
set r_mode -1
set r_customwidth 2560
set r_customheight 1440
set r_fullscreen 0
set s_volume 0
set s_initsound 0
set r_finish 0
set r_gpuTimers 10
set r_swapInterval 0
set com_maxfps 0
set r_postProcess 1
set r_hdr 1
set r_toneMap 1
set r_autoExposure 1
set r_ext_multisample 4
set r_ext_texture_filter_anisotropic 1
set r_pbr 0
set r_cubeMapping 0
set r_ssao 1
set r_drawSunRays 1
set r_sunShadows 0
set r_bloom 0.4
set r_dof 1
set r_dofAmount 0
set r_dofAutoFocus 0
set cg_dofBulletTime 0
set r_depthPrepass 1
set r_grade 1
set r_fxaa 1
set r_gradeExposure 0.2
set r_gradeWhitePoint 1.5
set r_gradeShoulder 0.4
set r_gradeMeterFloor -5
set r_gradeSaturation 0.62
set r_gradeSplit 0.5
set r_gradeLift 0.045
set r_water 1
set r_shafts 0.35
set r_bodycam 0
set cg_bodycam 0
set cg_draw2D 0
set cg_drawGun 0
set g_timeBind 0
set cg_timeGrade 0
set bot_enable 0
set cg_killcam 0

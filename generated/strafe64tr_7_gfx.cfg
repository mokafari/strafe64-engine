// strafegen_gfx — recommended render cvars for the graphics recipes.
// exec this after the map loads (or fold into your launcher).
seta r_sunShadows 1
seta r_sunlightMode 1
seta r_forceSunAmbientScale 0.45
seta r_forceToneMap 1
seta r_forceToneMapMin -5.5
seta r_forceToneMapAvg -2.1
seta r_forceToneMapMax 0.1
seta r_shadowFilter 2
seta r_shadowMapSize 4096
seta r_normalMapping 1
seta r_specularMapping 1
seta r_parallaxMapping 2
seta r_ssao 0
seta r_hdr 1
seta r_toneMap 1
seta r_autoExposure 0
seta r_cameraExposure 0.55
vid_restart

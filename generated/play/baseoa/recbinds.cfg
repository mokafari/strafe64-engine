set _recTog "vstr _recOn"
set _recOn  "record; set _recTog vstr _recOff; echo ^1REC^7 clip started"
set _recOff "stoprecord; set _recTog vstr _recOn; echo ^2clip saved"
set _demTog "exec sword"
set _tpTog "vstr _tpOn"
set _tpOn  "cg_thirdPerson 1; cg_thirdPersonRange 110; set _tpTog vstr _tpOff"
set _tpOff "cg_thirdPerson 0; set _tpTog vstr _tpOn"
set _recMode "vstr _cleanOn"
set _cleanOn  "cg_draw2D 0; cg_drawGun 0; set _recMode vstr _cleanOff"
set _cleanOff "cg_draw2D 1; cg_drawGun 1; set _recMode vstr _cleanOn"
